<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PFA - Détection d'Accidents | SafeTrack</title>
    <!-- Bootstrap 5 + Icons + Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e9eff9 100%);
            min-height: 100vh;
        }
        /* Sidebar moderne */
        .wrapper {
            display: flex;
            width: 100%;
            align-items: stretch;
        }
        #sidebar {
            min-width: 280px;
            max-width: 280px;
            background: linear-gradient(180deg, #0a2540 0%, #1b4a6e 100%);
            color: #fff;
            transition: all 0.3s;
            height: 100vh;
            position: sticky;
            top: 0;
            box-shadow: 4px 0 25px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        #sidebar .sidebar-header {
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.2);
        }
        #sidebar .sidebar-header h3 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #fff, #a5f3fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        #sidebar .sidebar-header p {
            font-size: 0.75rem;
            opacity: 0.8;
            letter-spacing: 1px;
        }
        #sidebar ul.components {
            padding: 20px 0;
        }
        #sidebar ul li a {
            padding: 14px 24px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #e2e8f0;
            transition: all 0.25s;
            text-decoration: none;
            font-weight: 500;
            border-left: 3px solid transparent;
        }
        #sidebar ul li a i {
            width: 24px;
            font-size: 1.2rem;
        }
        #sidebar ul li a:hover {
            background: rgba(255,255,255,0.1);
            color: white;
            border-left-color: #60a5fa;
            padding-left: 30px;
        }
        #sidebar ul li.active a {
            background: rgba(37, 99, 235, 0.3);
            color: white;
            border-left-color: #3b82f6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        /* Content */
        #content {
            width: 100%;
            padding: 25px 30px;
            min-height: 100vh;
            transition: all 0.3s;
        }
        /* Cards personnalisées */
        .card-modern {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(2px);
            border-radius: 1.5rem;
            border: none;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-modern:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.2);
        }
        .btn-gradient {
            background: linear-gradient(95deg, #1e40af, #2563eb);
            border: none;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
            color: white;
        }
        .badge-soft {
            background: rgba(59,130,246,0.15);
            color: #1e40af;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 40px;
        }
        /* Responsive */
        @media (max-width: 768px) {
            #sidebar {
                margin-left: -280px;
            }
            #sidebar.active {
                margin-left: 0;
            }
            #content {
                padding: 15px;
            }
        }
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 10px;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<div class="wrapper">
    <!-- Sidebar -->
    <nav id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-car-crash me-2"></i>SafeTrack</h3>
            <p>Détection d'accidents IA</p>
        </div>
        <ul class="list-unstyled components">
            <li class="{% if request.endpoint == 'index' %}active{% endif %}">
                <a href="{{ url_for('index') }}"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            </li>
            <li class="{% if request.endpoint == 'history' %}active{% endif %}">
                <a href="{{ url_for('history') }}"><i class="fas fa-history"></i> Historique</a>
            </li>
            <li class="{% if request.endpoint == 'map_view' %}active{% endif %}">
                <a href="{{ url_for('map_view') }}"><i class="fas fa-map-marked-alt"></i> Carte des risques</a>
            </li>
            
             <li class="{% if request.endpoint == 'accident_dashboard' %}active{% endif %}">
                <a href="{{ url_for('accident_dashboard') }}"><i class="fas fa-chart-pie"></i> Statistiques accidents 2026</a>
            </li>

        </ul>
       
    </nav>

    <!-- Page Content -->
    <div id="content">
        {% block content %}{% endblock %}
    </div>
</div>

<!-- Bouton toggle sidebar pour mobile (optionnel) -->
<button class="btn btn-light rounded-circle shadow-sm position-fixed bottom-4 end-4 d-md-none" id="sidebarToggle" style="bottom: 20px; right: 20px; z-index: 1100;">
    <i class="bi bi-list"></i>
</button>
<script>
    document.getElementById('sidebarToggle')?.addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('active');
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
